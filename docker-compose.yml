name: rpg

services:
  daggerheart:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./db:/app/db
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
