<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efe9df">
<title>River Sky — Daggerheart Companion</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script>
  // Force the classic JSX runtime: @babel/standalone defaults the react preset to the
  // automatic runtime, which emits `import … from "react/jsx-runtime"` — unresolvable in
  // a plain <script>. Classic emits React.createElement against the React UMD global.
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
</script>
</head>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react-classic">
/* eslint-disable */
// River Sky v2 — the companion app. The visual design is the Claude Design v2
// prototype (theme=vellum, type=spectral, campaign layout=feed, density=6); the data
// is the live Express/SQLite backend, bridged by the normalization adapter below.

// ── Theme tokens (vellum + spectral, baked from the prototype) ───────────────────
const VELLUM = {
  dark: false,
  bg:        '#efe9df',
  bgGlow:    'radial-gradient(120% 80% at 50% -10%, rgba(176,106,44,0.10), transparent 60%)',
  surface:   '#fbf8f2',
  surface2:  '#f3ede2',
  raised:    '#ffffff',
  line:      'rgba(58,44,30,0.12)',
  lineStr:   'rgba(58,44,30,0.22)',
  ink:       '#241c14',
  inkSoft:   '#5d4f3f',
  inkMute:   '#94836f',
  accent:    '#b0692a',
  accentSoft:'rgba(176,105,42,0.14)',
  hope:      '#bd7d1f',
  hp:        '#b0432d',
  stress:    '#4a5680',
  danger:    '#b0432d',
  good:      '#3f7d52',
  spell:     '#b0432d',
  weapon:    '#345f86',
  ability:   '#6b46a3',
  shadow:    '0 18px 44px rgba(60,40,20,0.18)',
};
const SPECTRAL = {
  serif: `'Spectral', Georgia, 'Times New Roman', serif`,
  sans:  `'Hanken Grotesk', system-ui, -apple-system, sans-serif`,
  mono:  `'Spline Sans Mono', ui-monospace, 'SF Mono', monospace`,
};
const T = { ...VELLUM, ...SPECTRAL };
const DENSITY = 6;

(function injectGlobal() {
  if (document.getElementById('rs-global')) return;
  const s = document.createElement('style');
  s.id = 'rs-global';
  s.textContent = `
    @keyframes rs-fade { from { transform: translateY(9px); } to { transform: none; } }
    @keyframes rs-sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes rs-scrim-in { from { opacity:0; } to { opacity:1; } }
    @keyframes rs-pulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
    @keyframes rs-pop { 0% { transform: scale(0.4); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .rs-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .rs-scroll { scrollbar-width: none; }
    .rs-tap { -webkit-tap-highlight-color: transparent; }
    .rs-card-enter { animation: rs-fade 0.32s cubic-bezier(0.22,0.61,0.36,1); }
    input, textarea, button { font-family: inherit; }
    @media (prefers-reduced-motion: reduce) {
      .rs-card-enter, [class^="rs-"] { animation: none !important; }
    }
  `;
  document.head.appendChild(s);
})();

// ── Generic helpers + Daggerheart math ──────────────────────────────────────────
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid(p) { return p + Math.random().toString(36).slice(2, 7); }

const SKILLS = {
  agility:   'Sprint · Leap · Maneuver',
  strength:  'Lift · Smash · Grapple',
  finesse:   'Control · Hide · Tinker',
  instinct:  'Perceive · Sense · Navigate',
  presence:  'Charm · Perform · Deceive',
  knowledge: 'Recall · Analyze · Comprehend',
};
const TRAIT_KEYS = ['agility', 'strength', 'finesse', 'instinct', 'presence', 'knowledge'];

function diceStr(a) {
  if (!a.diceCount) return '—';
  let s = `${a.diceCount}d${a.diceSides}`;
  if (a.dmod > 0) s += `+${a.dmod}`;
  else if (a.dmod < 0) s += a.dmod;
  return s;
}
function avgDmg(a) {
  if (!a.diceCount) return 0;
  return a.diceCount * (a.diceSides + 1) / 2 + (a.dmod || 0);
}
// 2d12 + mod vs difficulty; matched dice always crit.
function hitChance(mod, diff = 14) {
  let crits = 0, hits = 0;
  for (let x = 1; x <= 12; x++) for (let y = 1; y <= 12; y++) {
    if (x === y) crits++;
    else if (x + y + mod >= diff) hits++;
  }
  return (crits + hits) / 144;
}
function fmtMod(n) { return n >= 0 ? `+${n}` : `${n}`; }

function classGlyph(cls) {
  return { Bard:'♪', Druid:'❧', Guardian:'❖', Ranger:'➶', Rogue:'◐', Seraph:'☼',
    Sorcerer:'✦', Warrior:'⚔', Wizard:'✶', Witch:'☾' }[cls] || '✦';
}
function classHue(seed) {
  let h = 0; for (const ch of String(seed || '')) h = (h * 31 + ch.charCodeAt(0)) % 360; return h;
}
function derivePortraitClient(c) {
  if (c && c.portrait && typeof c.portrait === 'object') return c.portrait;
  const bi = (c && c.basicInfo) || {};
  return { hue: classHue(bi.class || bi.name), glyph: classGlyph(bi.class) };
}
function relTime(w) {
  if (!w || w === 'just now') return 'just now';
  const t = new Date(String(w).replace(' ', 'T')).getTime();
  if (isNaN(t)) return String(w);
  const diff = Date.now() - t;
  if (diff < 0) return 'just now';
  const m = Math.floor(diff / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  if (d < 7) return d + 'd ago';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// ── Normalization adapter (persisted shape ⇄ prototype shape) ────────────────────
// The UI components are written against the prototype's data shape. We never change
// what is persisted (character.html / advisor.html read the same blob), so we adapt
// at the API boundary only.
function normalizeAttack(a, i) {
  const tags = [];
  if (a.aoe) tags.push('AoE');
  if (a.friendlyFire) tags.push('Friendly Fire');
  if (a.noRoll) tags.push('No Roll');
  if (a.utility) tags.push('Utility');
  if (a.groundsFliers) tags.push('Grounds Fliers');
  if (a.costStress) tags.push('Costs Stress');
  if (a.needConstruct) tags.push('Needs Construct');
  if (Array.isArray(a.tags)) for (const t of a.tags) if (!tags.includes(t)) tags.push(t);
  return {
    id: a.id || ('a' + i), name: a.name || '', type: a.type || 'weapon', trait: a.trait || '',
    mod: a.mod ?? 0, diceCount: a.diceCount ?? 0, diceSides: a.diceSides ?? 6, dmod: a.dmod ?? 0,
    range: Array.isArray(a.range) ? a.range : (a.range ? [a.range] : []), tags, note: a.note || '',
  };
}
function normalizeFromApi(c) {
  c = c || {};
  const res = c.resources || {};
  const hopeObj = res.hope && typeof res.hope === 'object';
  const thr = c.thresholds || {};
  const def = c.defenses || {};
  const traits = {};
  for (const k of TRAIT_KEYS) {
    const raw = c.traits ? c.traits[k] : 0;
    const val = (raw && typeof raw === 'object') ? (raw.val ?? 0) : (raw ?? 0);
    traits[k] = { val: Number(val) || 0, skills: SKILLS[k] };
  }
  const armor = c.armor || {};
  const eq = (armor.items || []).find(it => it.id === armor.equippedId) || (armor.items || [])[0];
  const armorName = eq ? eq.name : (armor.equippedName || '');
  return {
    id: 'active', owner: 'you', status: c.dead ? 'fallen' : 'active',
    basicInfo: { name: '', pronouns: '', ancestry: '', community: '', class: '', subclass: '', level: 1, proficiency: 1, ...(c.basicInfo || {}) },
    portrait: c.portrait || derivePortraitClient(c),
    traits,
    resources: {
      hp:     { current: res.hp?.current ?? 0, max: res.hp?.max ?? 0 },
      stress: { current: res.stress?.current ?? 0, max: res.stress?.max ?? 0 },
      hope:    hopeObj ? res.hope.current : (res.hope ?? 0),
      hopeMax: hopeObj ? res.hope.max : (res.hopeMax ?? 6),
      armor:  { current: armor.slotsUsed ?? 0, max: armor.slotsMax ?? 0 },
    },
    defenses: { evasion: def.evasion ?? 0, major: (thr.major ?? def.major ?? 0), severe: (thr.severe ?? def.severe ?? 0) },
    conditions: { vulnerable: false, restrained: false, hidden: false, unconscious: false, ...(c.conditions || {}) },
    attacks: (c.attacks || []).map(normalizeAttack),
    domainCards: (c.domainCards || []).map(d => ({ id: d.id || uid('d'), name: d.name || '', domain: d.domain || '', recall: d.recall ?? 0, level: d.level ?? 1, type: d.type || '', summary: d.summary || '', text: d.text || d.summary || '' })),
    inventory: (c.inventory || []).map(it => ({ id: it.id || uid('i'), name: it.name || '', qty: it.qty ?? 1, note: it.note ?? '' })),
    experiences: (c.experiences || []).map(e => ({ id: e.id || uid('e'), name: e.name || '', mod: e.modifier ?? e.mod ?? 0, note: e.description ?? e.note ?? '' })),
    features: (c.features || []).map(f => ({ id: f.id || uid('ft'), name: f.name || '', note: f.note ?? f.description ?? '' })),
    downtimeProjects: (c.downtimeProjects || []).map(p => ({ id: p.id || uid('dp'), name: p.name || '', progress: p.progress ?? 0, max: p.max ?? 4, note: p.note ?? '' })),
    armorEquipped: { name: armorName, slots: armor.slotsMax ?? 0 },
    gold: { handfuls: (res.gold || c.gold || {}).handfuls ?? 0, bags: (res.gold || c.gold || {}).bags ?? 0, chests: (res.gold || c.gold || {}).chests ?? 0 },
    notes: c.notes || '',
    dead: !!c.dead,
  };
}
// Start from the persisted base (preserves untouched fields: weapons, attack flags,
// armor item structure, etc.) and overwrite only what the new UI manages.
function denormalizeToApi(ch, base) {
  const out = base ? clone(base) : {};
  out.basicInfo = { ...(out.basicInfo || {}), ...ch.basicInfo };
  out.traits = {};
  for (const k of TRAIT_KEYS) out.traits[k] = ch.traits[k].val;
  out.resources = out.resources || {};
  out.resources.hp = { current: ch.resources.hp.current, max: ch.resources.hp.max };
  out.resources.stress = { current: ch.resources.stress.current, max: ch.resources.stress.max };
  out.resources.hope = ch.resources.hope;
  out.resources.gold = { handfuls: ch.gold.handfuls, bags: ch.gold.bags, chests: ch.gold.chests };
  out.defenses = { ...(out.defenses || {}), evasion: ch.defenses.evasion };
  out.thresholds = { ...(out.thresholds || {}), major: ch.defenses.major, severe: ch.defenses.severe };
  out.armor = out.armor || { items: [], equippedId: null };
  out.armor.slotsMax = ch.resources.armor.max;
  out.armor.slotsUsed = Math.min(ch.resources.armor.current, ch.resources.armor.max);
  const nm = ch.armorEquipped && ch.armorEquipped.name;
  if (nm) {
    const items = out.armor.items || [];
    let eq = items.find(it => it.id === out.armor.equippedId) || items[0];
    if (eq) { eq.name = nm; if (out.armor.equippedId == null) out.armor.equippedId = eq.id; }
    else { eq = { id: 'ar1', name: nm, major: ch.defenses.major, severe: ch.defenses.severe, slots: ch.resources.armor.max }; items.push(eq); out.armor.equippedId = eq.id; }
    out.armor.items = items;
  }
  out.experiences = ch.experiences.map(e => ({ id: e.id, name: e.name, modifier: e.mod, description: e.note }));
  out.features = ch.features.map(f => ({ id: f.id, name: f.name, note: f.note }));
  out.downtimeProjects = ch.downtimeProjects.map(p => ({ id: p.id, name: p.name, progress: p.progress, max: p.max, note: p.note }));
  out.inventory = ch.inventory.map(it => ({ id: it.id, name: it.name, qty: it.qty, note: it.note }));
  out.domainCards = ch.domainCards.map(d => ({ id: d.id, name: d.name, domain: d.domain, recall: d.recall, level: d.level, type: d.type, summary: d.summary, text: d.text }));
  out.portrait = ch.portrait;
  out.notes = ch.notes;
  out.dead = !!ch.dead;
  return out;  // attacks / weapons preserved untouched from base
}
// Roster entry from the campaign-overview character summary → prototype roster shape.
function toRosterEntry(o) {
  return {
    id: o.characterId ?? o.id, owner: o.owner || 'you', status: o.status || 'active',
    basicInfo: { name: o.name, class: o.class, subclass: o.subclass, level: o.level, ancestry: o.ancestry },
    portrait: o.portrait || { hue: 32, glyph: '✦' },
    resources: { hp: o.hp || { current: 0, max: 0 }, stress: o.stress || { current: 0, max: 0 }, hope: o.hope ?? 0, hopeMax: o.hopeMax ?? 6 },
    fellAt: o.fellAt, epitaph: o.epitaph, isActive: !!o.isActive, isYou: o.owner === 'you',
  };
}

// ── Icons ────────────────────────────────────────────────────────────────────────
function Icon({ name, s = 22, c = 'currentColor', sw = 1.6 }) {
  const p = { fill: 'none', stroke: c, strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    combat: <><path d="M14.5 3.5l6 6-9.5 9.5-2.5.5.5-2.5L18.5 7" {...p} /><path d="M4 20l2.5-2.5" {...p} /><path d="M14.5 3.5l3 0 0 3" {...p} /></>,
    sheet:  <><rect x="5" y="3" width="14" height="18" rx="2.2" {...p} /><path d="M9 8h6M9 12h6M9 16h3.5" {...p} /></>,
    cards:  <><rect x="3.5" y="6.5" width="10.5" height="13.5" rx="2" {...p} /><path d="M9 6V5.2A2 2 0 0111 3.2l5.5 1.6a2 2 0 011.4 2.4L15 18" {...p} /></>,
    camp:   <><path d="M12 3l8 5v8l-8 5-8-5V8z" {...p} /><path d="M12 3v18M4 8l8 5 8-5" {...p} /></>,
    feed:   <><path d="M5 5h14M5 10h14M5 15h9" {...p} /><circle cx="18" cy="16" r="3" {...p} /></>,
    hope:   <><path d="M12 3l2.4 5.3 5.6.5-4.3 3.8 1.3 5.6L12 20.5 6.7 18.8 8 13.2 3.7 9.4l5.6-.5z" {...p} /></>,
    skull:  <><path d="M12 3a7 7 0 00-7 7v3.5l1.5 1.5v2.5a1 1 0 001 1h11a1 1 0 001-1V15L19 13.5V10a7 7 0 00-7-7z" {...p} /><circle cx="9" cy="11" r="1.4" fill={c} stroke="none" /><circle cx="15" cy="11" r="1.4" fill={c} stroke="none" /><path d="M10.5 18v2M13.5 18v2" {...p} /></>,
    chevron:<path d="M9 6l6 6-6 6" {...p} />,
    chevronD:<path d="M6 9l6 6 6-6" {...p} />,
    plus:   <><path d="M12 5v14M5 12h14" {...p} /></>,
    minus:  <path d="M5 12h14" {...p} />,
    close:  <><path d="M6 6l12 12M18 6L6 18" {...p} /></>,
    menu:   <><path d="M4 7h16M4 12h16M4 17h16" {...p} /></>,
    bolt:   <><path d="M13 3L5 13h5l-1 8 8-10h-5z" {...p} /></>,
    shield: <><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z" {...p} /></>,
    leaf:   <><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z" {...p} /><path d="M5 19c4-6 8-8 12-9" {...p} /></>,
    note:   <><path d="M5 4h9l5 5v11a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z" {...p} /><path d="M14 4v5h5" {...p} /><path d="M8 13h7M8 16.5h4.5" {...p} /></>,
    play:   <><circle cx="12" cy="12" r="8.5" {...p} /><path d="M10.5 9.2l4.5 2.8-4.5 2.8z" fill={c} stroke="none" /></>,
    stop:   <><circle cx="12" cy="12" r="8.5" {...p} /><rect x="9.5" y="9.5" width="5" height="5" rx="1" fill={c} stroke="none" /></>,
    edit:   <><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" {...p} /><path d="M14.5 6.5l3 3" {...p} /></>,
    external:<><path d="M14 4h6v6" {...p} /><path d="M20 4l-9 9" {...p} /><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" {...p} /></>,
  };
  return <svg width={s} height={s} viewBox="0 0 24 24" style={{ display: 'block', flexShrink: 0 }}>{paths[name]}</svg>;
}

// ── Shared UI atoms ────────────────────────────────────────────────────────────
function Eyebrow({ children, style }) {
  return <div style={{ fontFamily: T.sans, fontSize: 10.5, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase', color: T.inkMute, ...style }}>{children}</div>;
}
function Pips({ value, max, color, onTick, size = 16, gap = 6, animate = true }) {
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap }}>
      {Array.from({ length: max }).map((_, i) => {
        const filled = i < value;
        return (
          <button key={i} className="rs-tap" onClick={() => onTick(i + 1 === value ? i : i + 1)}
            style={{ width: size, height: size, borderRadius: '50%', padding: 0, boxSizing: 'border-box',
              border: `1.5px solid ${color}`, background: filled ? color : 'transparent', cursor: 'pointer',
              transition: 'background 0.16s, transform 0.16s', animation: filled && animate ? 'rs-pop 0.26s ease' : 'none' }} />
        );
      })}
    </div>
  );
}
function Tag({ children, color, soft }) {
  const c = color || T.accent;
  return <span style={{ fontFamily: T.sans, fontSize: 10.5, fontWeight: 600, letterSpacing: '0.02em', color: c, background: soft || (T.dark ? `${c}22` : `${c}18`), borderRadius: 5, padding: '2px 7px', whiteSpace: 'nowrap' }}>{children}</span>;
}
function Avatar({ ch, size = 44, dim }) {
  const hue = ch.portrait ? ch.portrait.hue : 32;
  const glyph = ch.portrait ? ch.portrait.glyph : '✦';
  const fallen = ch.status === 'fallen';
  return (
    <div style={{ width: size, height: size, borderRadius: 13, flexShrink: 0, display: 'grid', placeItems: 'center', position: 'relative',
      background: fallen ? (T.dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)') : `linear-gradient(150deg, hsl(${hue} 55% ${T.dark ? 32 : 70}%), hsl(${hue + 20} 50% ${T.dark ? 22 : 58}%))`,
      border: `1px solid ${T.line}`, color: fallen ? T.inkMute : (T.dark ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.96)'),
      fontFamily: T.serif, fontSize: size * 0.46, lineHeight: 1, opacity: dim ? 0.7 : 1, boxShadow: fallen ? 'none' : 'inset 0 1px 0 rgba(255,255,255,0.18)' }}>
      {fallen ? <Icon name="skull" s={size * 0.5} c={T.inkMute} sw={1.5} /> : <span style={{ marginTop: -1 }}>{glyph}</span>}
    </div>
  );
}
function Card({ children, style, onClick, raised }) {
  return <div className="rs-tap" onClick={onClick} style={{ background: raised ? T.raised : T.surface, border: `1px solid ${T.line}`, borderRadius: 16, cursor: onClick ? 'pointer' : 'default', ...style }}>{children}</div>;
}
function BottomSheet({ open, onClose, children }) {
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position: 'absolute', inset: 0, zIndex: 60, display: 'flex', alignItems: 'flex-end' }}>
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(8,5,3,0.55)', animation: 'rs-scrim-in 0.2s ease both' }} />
      <div onClick={(e) => e.stopPropagation()} className="rs-scroll" style={{ position: 'relative', width: '100%', maxHeight: '82%', overflowY: 'auto', background: T.surface, borderTop: `1px solid ${T.lineStr}`, borderRadius: '22px 22px 0 0', padding: '10px 18px 26px', boxShadow: '0 -16px 44px rgba(0,0,0,0.4)', animation: 'rs-sheet-in 0.3s cubic-bezier(0.22,0.61,0.36,1) both' }}>
        <div style={{ width: 38, height: 4, borderRadius: 2, background: T.lineStr, margin: '0 auto 14px' }} />
        {children}
      </div>
    </div>
  );
}
function MiniBar({ value, max, color }) {
  const pct = max ? Math.max(0, Math.min(1, value / max)) : 0;
  return <div style={{ height: 5, borderRadius: 3, background: T.dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)', overflow: 'hidden' }}><div style={{ width: `${pct * 100}%`, height: '100%', background: color, borderRadius: 3, transition: 'width 0.3s ease' }} /></div>;
}

// ── Editable field atoms ──────────────────────────────────────────────────────
function EditText({ value, onChange, placeholder, font, size = 14.5, weight = 400, color, italic, multiline, variant = 'inline', flex }) {
  const [editing, setEditing] = React.useState(false);
  const [val, setVal] = React.useState(value);
  React.useEffect(() => { if (!editing) setVal(value); }, [value, editing]);
  const commit = () => { setEditing(false); if (val !== value) onChange(val); };
  const base = { fontFamily: font || T.sans, fontSize: size, fontWeight: weight, color: color || T.ink, fontStyle: italic ? 'italic' : 'normal' };
  if (editing) {
    const Comp = multiline ? 'textarea' : 'input';
    return (
      <Comp autoFocus value={val} rows={multiline ? 3 : undefined} inputMode="text"
        onChange={e => setVal(e.target.value)} onBlur={commit}
        onKeyDown={e => { if (e.key === 'Enter' && !multiline) { e.preventDefault(); commit(); } if (e.key === 'Escape') { setVal(value); setEditing(false); } }}
        style={{ ...base, width: '100%', boxSizing: 'border-box', background: T.surface2, border: `1px solid ${T.accent}`, borderRadius: multiline ? 10 : 8, padding: multiline ? '9px 11px' : '4px 8px', outline: 'none', resize: multiline ? 'vertical' : 'none', lineHeight: multiline ? 1.55 : 1.25, display: 'block' }} />
    );
  }
  const empty = value === '' || value == null;
  const shown = empty ? (placeholder || 'Add…') : value;
  if (variant === 'field') {
    return <div onClick={() => setEditing(true)} className="rs-tap" style={{ ...base, color: empty ? T.inkMute : base.color, fontStyle: empty ? 'italic' : base.fontStyle, cursor: 'text', background: T.surface2, border: `1px solid ${T.line}`, borderRadius: 8, padding: '7px 10px', lineHeight: multiline ? 1.55 : 1.3, minHeight: multiline ? 56 : 'auto', whiteSpace: 'pre-wrap' }}>{shown}</div>;
  }
  return <span onClick={() => setEditing(true)} className="rs-tap" style={{ ...base, color: empty ? T.inkMute : base.color, fontStyle: empty ? 'italic' : base.fontStyle, cursor: 'text', borderBottom: `1px dashed ${T.lineStr}`, paddingBottom: 1, display: multiline ? 'block' : 'inline', flex: flex ? 1 : undefined }}>{shown}</span>;
}
function Stepper({ value, onChange, min = -99, max = 999, fmt, size = 16, color }) {
  const v = Number(value) || 0;
  const btn = { width: 24, height: 24, borderRadius: 8, border: `1px solid ${T.line}`, background: T.surface2, color: T.inkSoft, cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0, flexShrink: 0 };
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, maxWidth: '100%' }}>
      <button className="rs-tap" onClick={() => onChange(Math.max(min, v - 1))} style={btn}><Icon name="minus" s={13} c={T.inkSoft} sw={2} /></button>
      <span style={{ fontFamily: T.serif, fontSize: size, fontWeight: 600, color: color || T.ink, minWidth: 20, textAlign: 'center', fontVariantNumeric: 'tabular-nums' }}>{fmt ? fmt(v) : v}</span>
      <button className="rs-tap" onClick={() => onChange(Math.min(max, v + 1))} style={btn}><Icon name="plus" s={13} c={T.inkSoft} sw={2} /></button>
    </span>
  );
}
function Clock({ value, max, onChange, color }) {
  return (
    <div style={{ display: 'flex', gap: 4 }}>
      {Array.from({ length: max }).map((_, i) => {
        const filled = i < value;
        return <button key={i} className="rs-tap" onClick={() => onChange(i + 1 === value ? i : i + 1)} style={{ flex: 1, height: 14, borderRadius: 4, padding: 0, cursor: 'pointer', border: `1px solid ${filled ? color : T.lineStr}`, background: filled ? color : 'transparent', transition: 'background 0.14s' }} />;
      })}
    </div>
  );
}
function RemoveBtn({ onClick }) {
  return <button className="rs-tap" onClick={onClick} style={{ width: 24, height: 24, borderRadius: 7, border: `1px solid ${T.line}`, background: 'transparent', color: T.inkMute, cursor: 'pointer', display: 'grid', placeItems: 'center', padding: 0, flexShrink: 0 }} title="Remove"><Icon name="close" s={12} c={T.inkMute} sw={1.8} /></button>;
}
function AddRow({ label, onClick }) {
  return <button className="rs-tap" onClick={onClick} style={{ width: '100%', marginTop: 11, padding: '9px 0', borderRadius: 10, cursor: 'pointer', border: `1.5px dashed ${T.lineStr}`, background: 'transparent', color: T.inkSoft, fontFamily: T.sans, fontSize: 12.5, fontWeight: 600, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7 }}><Icon name="plus" s={15} c={T.inkSoft} sw={1.8} />{label}</button>;
}
function setPath(obj, path, value) {
  const keys = path.split('.');
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
}

// ── Combat screen ─────────────────────────────────────────────────────────────
function CombatScreen({ ch, onRes, onCond, onOpenAttack, density }) {
  const [filter, setFilter] = React.useState('All');
  const hp = ch.resources.hp, stress = ch.resources.stress;
  const hope = ch.resources.hope, hopeMax = ch.resources.hopeMax || 6;
  const def = ch.defenses;
  const conds = ch.conditions || {};
  const activeConds = Object.keys(conds).filter(k => conds[k]);
  const RANGES = ['All', 'Melee', 'Close', 'Far'];
  const list = (ch.attacks || []).filter(a => filter === 'All' ? true : (a.range || []).some(r => r.startsWith(filter)));
  const typeColor = (t) => t === 'spell' ? T.spell : t === 'weapon' ? T.weapon : t === 'ability' ? T.ability : T.ink;
  const hitColor = (p) => p >= 0.66 ? T.good : p >= 0.45 ? T.accent : T.hp;
  const pad = density <= 4 ? 18 : 14;

  function ResBlock({ label, res, color }) {
    return (
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 7, marginBottom: 9 }}>
          <Eyebrow>{label}</Eyebrow>
          <span style={{ fontFamily: T.serif, fontSize: 17, fontWeight: 600, color }}>{res.current}<span style={{ color: T.inkMute, fontWeight: 400 }}>/{res.max}</span></span>
        </div>
        <Pips value={res.current} max={res.max} color={color} onTick={(v) => onRes(label === 'HP' ? 'hp' : 'stress', v)} size={14} gap={5} />
      </div>
    );
  }
  return (
    <div className="rs-card-enter" style={{ padding: `14px ${pad}px 24px`, display: 'flex', flexDirection: 'column', gap: 16 }}>
      <Card style={{ padding: 16 }}>
        <div style={{ display: 'flex', gap: 18 }}>
          <ResBlock label="HP" res={hp} color={T.hp} />
          <div style={{ width: 1, background: T.line }} />
          <ResBlock label="STRESS" res={stress} color={T.stress} />
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 16, paddingTop: 15, borderTop: `1px solid ${T.line}` }}>
          <Eyebrow style={{ display: 'flex', alignItems: 'center', gap: 6 }}><Icon name="hope" s={14} c={T.hope} sw={1.4} /> Hope</Eyebrow>
          <Pips value={hope} max={hopeMax} color={T.hope} onTick={(v) => onRes('hope', v)} size={18} gap={6} />
          <span style={{ marginLeft: 'auto', fontFamily: T.sans, fontSize: 11, color: T.inkMute }}>tap to spend</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 14, paddingTop: 14, borderTop: `1px solid ${T.line}` }}>
          <Eyebrow style={{ display: 'flex', alignItems: 'center', gap: 6 }}><Icon name="shield" s={14} c={T.weapon} sw={1.5} /> Armor</Eyebrow>
          <Pips value={ch.resources.armor.current} max={ch.resources.armor.max} color={T.weapon} onTick={(v) => onRes('armor', v)} size={18} gap={6} animate={false} />
          <span style={{ marginLeft: 'auto', fontFamily: T.sans, fontSize: 11, color: T.inkMute }}>spend to drop a threshold</span>
        </div>
      </Card>

      <div style={{ display: 'flex', gap: 8 }}>
        {[{ k: 'Minor', sub: 'mark 1 HP', val: `<${def.major}`, tone: T.inkSoft },
          { k: 'Major', sub: 'mark 2 HP', val: `${def.major}+`, tone: T.accent },
          { k: 'Severe', sub: 'mark 3 HP', val: `${def.severe}+`, tone: T.hp }].map(d => (
          <div key={d.k} style={{ flex: 1, background: T.surface, border: `1px solid ${T.line}`, borderRadius: 13, padding: '10px 11px', borderTop: `2px solid ${d.tone}` }}>
            <div style={{ fontFamily: T.sans, fontSize: 10.5, fontWeight: 700, letterSpacing: '0.08em', color: d.tone, textTransform: 'uppercase' }}>{d.k}</div>
            <div style={{ fontFamily: T.serif, fontSize: 21, fontWeight: 600, color: T.ink, lineHeight: 1.05, marginTop: 3 }}>{d.val}</div>
            <div style={{ fontFamily: T.sans, fontSize: 10, color: T.inkMute, marginTop: 1 }}>{d.sub}</div>
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        <Stat icon="shield" label="Evasion" value={def.evasion} />
        <Stat icon="leaf" label="Hope" value={`${ch.resources.hope}/${ch.resources.hopeMax || 6}`} />
        <div style={{ flex: 1 }} />
        {activeConds.length === 0
          ? <span style={{ fontFamily: T.sans, fontSize: 12, color: T.inkMute, fontStyle: 'italic' }}>No conditions</span>
          : activeConds.map(c => (
            <button key={c} className="rs-tap" onClick={() => onCond(c)} style={{ fontFamily: T.sans, fontSize: 12, fontWeight: 600, textTransform: 'capitalize', color: T.danger, background: T.dark ? `${T.danger}22` : `${T.danger}16`, border: `1px solid ${T.danger}`, borderRadius: 999, padding: '5px 11px', cursor: 'pointer' }}>{c} ✕</button>
          ))}
      </div>

      <div>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
          <Eyebrow>Attacks · {list.length}</Eyebrow>
          <span style={{ fontFamily: T.sans, fontSize: 10.5, color: T.inkMute }}>vs. Difficulty 14</span>
        </div>
        <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
          {RANGES.map(r => (
            <button key={r} className="rs-tap" onClick={() => setFilter(r)} style={{ fontFamily: T.sans, fontSize: 12, fontWeight: 600, padding: '6px 13px', borderRadius: 999, cursor: 'pointer', border: `1px solid ${filter === r ? T.ink : T.line}`, background: filter === r ? T.ink : 'transparent', color: filter === r ? (T.dark ? T.bg : T.surface) : T.inkSoft, transition: 'all 0.15s' }}>{r}</button>
          ))}
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
          {list.length === 0 && <div style={{ fontFamily: T.serif, fontStyle: 'italic', color: T.inkMute, fontSize: 14, padding: '6px 2px' }}>No attacks at this range.</div>}
          {list.map(a => {
            const pct = Math.round(hitChance(a.mod) * 100);
            const dmg = avgDmg(a);
            const tc = typeColor(a.type);
            return (
              <div key={a.id} className="rs-tap" onClick={() => onOpenAttack(a)} style={{ display: 'flex', alignItems: 'stretch', gap: 12, background: T.surface, border: `1px solid ${T.line}`, borderRadius: 14, padding: '13px 14px', cursor: 'pointer', position: 'relative', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: 3, background: tc }} />
                <div style={{ flex: 1, minWidth: 0, paddingLeft: 4 }}>
                  <div style={{ fontFamily: T.serif, fontSize: 18, fontWeight: 600, color: T.ink, lineHeight: 1.1 }}>{a.name}</div>
                  <div style={{ fontFamily: T.sans, fontSize: 10, fontWeight: 700, letterSpacing: '0.09em', textTransform: 'uppercase', color: tc, marginTop: 4 }}>{a.type} <span style={{ color: T.inkMute }}>· {(a.range || []).join(' / ')}</span></div>
                  {a.tags && a.tags.length > 0 && <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginTop: 8 }}>{a.tags.slice(0, 3).map(t => <Tag key={t}>{t}</Tag>)}</div>}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', justifyContent: 'center', gap: 6, minWidth: 104, borderLeft: `1px solid ${T.line}`, paddingLeft: 12 }}>
                  <div style={{ fontFamily: T.serif, fontStyle: 'italic', fontSize: 27, fontWeight: 500, color: T.ink, lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>{diceStr(a)}</div>
                  <div style={{ display: 'flex', gap: 10, fontFamily: T.mono, fontSize: 11, fontVariantNumeric: 'tabular-nums' }}>
                    <span style={{ color: T.inkMute }}>{fmtMod(a.mod)} <b style={{ color: hitColor(pct / 100), fontWeight: 700 }}>{pct}%</b></span>
                    <span style={{ color: T.inkMute }}>avg <b style={{ color: T.ink, fontWeight: 700 }}>{dmg.toFixed(0)}</b></span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
function Stat({ icon, label, value }) {
  return <div style={{ display: 'flex', alignItems: 'center', gap: 7, background: T.surface, border: `1px solid ${T.line}`, borderRadius: 10, padding: '6px 11px' }}><Icon name={icon} s={15} c={T.inkMute} sw={1.5} /><span style={{ fontFamily: T.sans, fontSize: 11, color: T.inkMute, letterSpacing: '0.04em' }}>{label}</span><span style={{ fontFamily: T.serif, fontSize: 16, fontWeight: 600, color: T.ink }}>{value}</span></div>;
}
function AttackDetail({ a }) {
  const tc = a.type === 'spell' ? T.spell : a.type === 'weapon' ? T.weapon : T.ability;
  const pct = Math.round(hitChance(a.mod) * 100);
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 16 }}>
        <div style={{ fontFamily: T.serif, fontSize: 25, fontWeight: 600, color: T.ink }}>{a.name}</div>
        <div style={{ fontFamily: T.sans, fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: tc }}>{a.type}</div>
      </div>
      <div style={{ display: 'flex', gap: 10, padding: 16, background: T.surface2, borderRadius: 13, alignItems: 'baseline' }}>
        <div style={{ fontFamily: T.serif, fontStyle: 'italic', fontSize: 40, fontWeight: 500, color: T.ink, lineHeight: 1 }}>{diceStr(a)}</div>
        <div style={{ flex: 1 }} />
        <div><Eyebrow>Avg</Eyebrow><div style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 600, color: T.ink, marginTop: 2 }}>{avgDmg(a).toFixed(1)}</div></div>
        <div style={{ width: 26 }} />
        <div><Eyebrow>Hit</Eyebrow><div style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 600, color: T.ink, marginTop: 2 }}>{fmtMod(a.mod)} <span style={{ color: T.accent }}>· {pct}%</span></div></div>
      </div>
      <div style={{ display: 'flex', gap: 22, marginTop: 16 }}>
        <div><Eyebrow>Range</Eyebrow><div style={{ fontFamily: T.sans, fontSize: 13, color: T.ink, marginTop: 3 }}>{(a.range || []).join(' · ')}</div></div>
        <div><Eyebrow>Trait</Eyebrow><div style={{ fontFamily: T.sans, fontSize: 13, color: T.ink, marginTop: 3, textTransform: 'capitalize' }}>{a.trait}</div></div>
      </div>
      {a.tags && a.tags.length > 0 && <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginTop: 14 }}>{a.tags.map(t => <Tag key={t} color={tc}>{t}</Tag>)}</div>}
      {a.note && <div style={{ fontFamily: T.serif, fontSize: 15, lineHeight: 1.55, color: T.inkSoft, marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.line}` }}>{a.note}</div>}
    </div>
  );
}

}

// ── Cards screen ──────────────────────────────────────────────────────────────
function CardsScreen({ ch, density }) {

    <div className="rs-card-enter" style={{ padding: `14px ${pad}px 24px`, display: 'flex', flexDirection: 'column', gap: 11 }}>

        <span style={{ fontFamily: T.sans, fontSize: 11.5, color: T.inkMute }}>Total recall <b style={{ color: T.accent, fontWeight: 700 }}>{totalRecall}</b></span>

      {cards.length === 0 && <div style={{ fontFamily: T.serif, fontStyle: 'italic', color: T.inkMute, fontSize: 14, padding: '8px 2px' }}>No domain cards on record. Add them in the full editor.</div>}

            <div style={{ position: 'absolute', top: 6, right: 14, fontFamily: T.serif, fontStyle: 'italic', fontSize: 44, fontWeight: 600, color: dc, opacity: T.dark ? 0.16 : 0.13, lineHeight: 1, pointerEvents: 'none' }}>{card.recall}</div>
            <div style={{ paddingRight: 40 }}>
              <div style={{ fontFamily: T.serif, fontSize: 18, fontWeight: 600, color: T.ink, lineHeight: 1.1 }}>{card.name}</div>
              <div style={{ fontFamily: T.sans, fontSize: 10, fontWeight: 700, letterSpacing: '0.09em', textTransform: 'uppercase', color: dc, marginTop: 5 }}>{card.domain} · {card.type} · Lv {card.level}</div>
            </div>
            <div style={{ fontFamily: T.serif, fontSize: 14, lineHeight: 1.55, color: T.inkSoft, marginTop: 9 }}>{open ? card.text : card.summary}</div>

      })}
    </div>
  );
}

function DeathDoor({ onClose, onLog, onDie }) {
  const [result, setResult] = React.useState(null);
  const opt = { textAlign: 'left', padding: '13px 15px', borderRadius: 12, border: `1px solid ${T.line}`, background: T.surface2, cursor: 'pointer', width: '100%' };
  const survive = () => { onLog('Death Move: Survive — lives on, potentially vulnerable'); onClose(); };
  const blaze = () => { onLog('Death Move: Blaze of Glory'); onDie(); onClose(); };
  const risk = () => {
    const roll = 1 + Math.floor(Math.random() * 6);
    const survived = roll >= 4;
    onLog(`Death Move: Risk It All — rolled ${roll} — ${survived ? 'Survived (GM decides erased slots)' : 'Died'}`);
    if (!survived) onDie();
    setResult({ roll, survived });
  };
  if (result) {
    return (
      <div style={{ textAlign: 'center', padding: '6px 4px 4px' }}>
        <div style={{ fontFamily: T.serif, fontSize: 46, fontWeight: 700, color: T.ink }}>🎲 {result.roll}</div>
        <div style={{ fontFamily: T.serif, fontSize: 19, fontWeight: 600, marginTop: 8, color: result.survived ? T.good : T.hp }}>{result.survived ? 'Survived — adjust HP per the GM' : '💀 The hero has fallen'}</div>
        <button className="rs-tap" onClick={onClose} style={{ width: '100%', marginTop: 18, padding: '12px 0', borderRadius: 12, border: 'none', cursor: 'pointer', background: T.accent, color: T.dark ? T.bg : '#fff', fontFamily: T.sans, fontSize: 14, fontWeight: 700 }}>Close</button>
      </div>
    );
  }
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="skull" s={24} c={T.hp} sw={1.5} /><div style={{ fontFamily: T.serif, fontSize: 23, fontWeight: 600, color: T.hp }}>Death’s Door</div></div>
      <div style={{ fontFamily: T.sans, fontSize: 12.5, color: T.inkSoft, marginTop: 6, lineHeight: 1.5 }}>All HP marked. Make a death move — the GM decides which apply.</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 9, marginTop: 16 }}>
        <button className="rs-tap" onClick={survive} style={opt}><div style={{ fontFamily: T.serif, fontSize: 16, fontWeight: 600, color: T.ink }}>1 · Survive</div><div style={{ fontFamily: T.sans, fontSize: 12, color: T.inkMute, marginTop: 2 }}>Live on, potentially vulnerable.</div></button>
        <button className="rs-tap" onClick={risk} style={opt}><div style={{ fontFamily: T.serif, fontSize: 16, fontWeight: 600, color: T.ink }}>2 · Risk It All</div><div style={{ fontFamily: T.sans, fontSize: 12, color: T.inkMute, marginTop: 2 }}>Roll the die — die, or survive.</div></button>
        <button className="rs-tap" onClick={blaze} style={{ ...opt, borderColor: T.hp }}><div style={{ fontFamily: T.serif, fontSize: 16, fontWeight: 600, color: T.hp }}>3 · Blaze of Glory</div><div style={{ fontFamily: T.sans, fontSize: 12, color: T.inkMute, marginTop: 2 }}>Die, but take something down with you.</div></button>
      </div>
    </div>
  );
}

// ── API layer ─────────────────────────────────────────────────────────────────
async function getJSON(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; }
}
async function postJSON(url, body, method = 'POST') {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { window.location = 'login.html'; throw new Error('unauthorized'); }
  return r;
}

// ── App shell ─────────────────────────────────────────────────────────────────
const TABS = [
  { id: 'campaign', label: 'Campaign', icon: 'camp' },
  { id: 'combat',   label: 'Combat',   icon: 'combat' },
  { id: 'sheet',    label: 'Sheet',    icon: 'sheet' },
  { id: 'cards',    label: 'Cards',    icon: 'cards' },
  { id: 'notes',    label: 'Notes',    icon: 'note' },
];

function App() {
  const [ready, setReady] = React.useState(false);
  const [tab, setTab] = React.useState('campaign');
  const [ch, setChState] = React.useState(null);
  const [activeId, setActiveId] = React.useState(null);
  const [campaign, setCampaign] = React.useState(null);
  const [campaignId, setCampaignId] = React.useState(null);
  const [roster, setRoster] = React.useState([]);
  const [feed, setFeed] = React.useState([]);
  const [session, setSession] = React.useState({ live: false, name: 'Session', startedAt: null, elapsed: '0m' });
  const [sheet, setSheet] = React.useState(null);

  const chRef = React.useRef(null);
  const apiBaseRef = React.useRef(null);
  const saveTimer = React.useRef(null);

  const setCh = (next) => { chRef.current = next; setChState(next); };

  function fmtElapsed(startedAt) {
    if (!startedAt) return '0m';
    const ms = Date.now() - startedAt;
    if (ms < 0) return '0m';
    const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
    return h ? `${h}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
  }

  function applyCampaign(camp) {
    if (!camp) return;
    setCampaign({ id: camp.id, name: camp.name, description: camp.description, gm: camp.gm, tagline: camp.tagline, sessionCount: (camp.sessions || []).length });
    setRoster((camp.characters || []).map(toRosterEntry));
    setFeed(camp.feed || []);
  }
  async function refresh() {
    const charRes = await getJSON('/api/character');
    if (charRes && charRes.character) {
      apiBaseRef.current = charRes.character;
      setCh(normalizeFromApi(charRes.character));
      setActiveId(charRes.characterId);
      const cid = charRes.campaigns && charRes.campaigns[0] ? charRes.campaigns[0].id : null;
      setCampaignId(cid);
      if (cid) applyCampaign(await getJSON('/api/campaigns/' + cid));
    }
  }
  React.useEffect(() => {
    (async () => {
      const [charRes, sessRes] = await Promise.all([getJSON('/api/character'), getJSON('/api/session/active')]);
      if (charRes && charRes.character) {
        apiBaseRef.current = charRes.character;
        setCh(normalizeFromApi(charRes.character));
        setActiveId(charRes.characterId);
        const cid = charRes.campaigns && charRes.campaigns[0] ? charRes.campaigns[0].id : null;
        setCampaignId(cid);
        if (cid) applyCampaign(await getJSON('/api/campaigns/' + cid));
      }
      if (sessRes && sessRes.session) {
        const started = new Date(String(sessRes.session.started_at).replace(' ', 'T')).getTime();
        setSession({ live: true, name: sessRes.session.name, startedAt: started, elapsed: fmtElapsed(started) });
      }
      setReady(true);
    })();
  }, []);

  React.useEffect(() => {
    if (!session.live) return;
    const tick = () => setSession(s => ({ ...s, elapsed: fmtElapsed(s.startedAt) }));
    tick();
    const iv = setInterval(tick, 30000);
    return () => clearInterval(iv);
  }, [session.live, session.startedAt]);

  function doSave(next) {
    const persisted = denormalizeToApi(next, apiBaseRef.current);
    fetch('/api/character/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ description: 'Mobile sync', character: persisted }) })
      .then(r => { if (r.status === 401) window.location = 'login.html'; else if (r.ok) apiBaseRef.current = persisted; })
      .catch(() => {});
  }
  function scheduleSave(next) {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => doSave(next), 1200);
  }
  function mutate(fn) {
    const next = clone(chRef.current);
    fn(next);
    setCh(next);
    scheduleSave(next);
  }

  function onRes(name, value) {
    const prevHp = chRef.current.resources.hp.current;
    const max = chRef.current.resources.hp.max;
    mutate(n => { if (name === 'hope') n.resources.hope = value; else n.resources[name].current = value; });
    if (name === 'hp' && value >= max && prevHp < max && !chRef.current.dead) {
      setTimeout(() => setSheet({ kind: 'death' }), 180);
    }
  }
  function onCond(key) { mutate(n => { n.conditions[key] = !n.conditions[key]; }); }
  function setNotes(text) { mutate(n => { n.notes = text; }); }
  function markDead() { mutate(n => { n.dead = true; }); }

  async function startSession() {
    const name = 'Session ' + (((campaign && campaign.sessionCount) || 0) + 1);
    try {
      const r = await postJSON('/api/session/start', { name, campaignId });
      if (!r.ok) return null;
      const d = await r.json();
      const startedAt = Date.now();
      setSession({ live: true, name, startedAt, elapsed: '0m' });
      setCampaign(c => c ? { ...c, sessionCount: (c.sessionCount || 0) + 1 } : c);
      setFeed(prev => [{ id: 'ms' + d.sessionId, kind: 'milestone', who: campaign ? campaign.name : 'The table', actor: campaign && campaign.gm ? campaign.gm : 'GM', when: 'just now', text: `${name} began` }, ...prev]);
      return d.sessionId;
    } catch (e) { return null; }
  }
  async function endSession() {
    try { await postJSON('/api/session/end'); } catch (e) {}
    const ended = session.name, elapsed = session.elapsed;
    setSession(s => ({ ...s, live: false }));
    setFeed(prev => [{ id: 'me' + Date.now(), kind: 'milestone', who: campaign ? campaign.name : 'The table', actor: campaign && campaign.gm ? campaign.gm : 'GM', when: 'just now', text: `${ended} ended · ${elapsed} logged` }, ...prev]);
    setSheet(null);
  }
  function toggleSession() { if (session.live) setSheet({ kind: 'endsession' }); else startSession(); }
  async function addNote(text) {
    if (!session.live) { await startSession(); }
    try { await postJSON('/api/session/note', { content: text }); } catch (e) {}
    setFeed(prev => [{ id: 'local' + Date.now(), kind: 'note', who: ch.basicInfo.name, actor: 'you', when: 'just now', text }, ...prev]);
  }
  async function logDeathNote(content) {
    try { await fetch('/api/session/note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) }); } catch (e) {}
    setFeed(prev => [{ id: 'death' + Date.now(), kind: 'death', who: ch.basicInfo.name, actor: 'you', when: 'just now', text: content }, ...prev]);
  }

  async function selectCharacter(id, goTo) {
    try { await fetch('/api/characters/select/' + id, { method: 'POST' }); } catch (e) {}
    await refresh();
    setSheet(null);
    setTab(goTo || 'combat');
  }
  function jump(c) {
    if (c.id === activeId) { setSheet(null); setTab('sheet'); }
    else selectCharacter(c.id, 'sheet');
  }
  function peek(c) { setSheet({ kind: c.status === 'fallen' ? 'memorial' : 'peek', payload: c }); }
  function onSwitch(c) { jump(c); }
  async function createCharacter({ name, cls }) {
    try {
      const r = await postJSON('/api/characters', { name, owner: 'you', campaignId });
      if (!r.ok) return;
      await refresh();
      mutate(n => { n.basicInfo.class = cls; });
      setSheet(null);
      setTab('sheet');
    } catch (e) {}
  }
  async function patchCampaign(fields) {
    if (!campaignId) { setSheet(null); return; }
    setCampaign(c => ({ ...c, ...fields }));
    setSheet(null);
    try { await postJSON('/api/campaigns/' + campaignId, fields, 'PATCH'); } catch (e) {}
  }
  function logout() {
    fetch('/api/logout', { method: 'POST' }).finally(() => { window.location = 'login.html'; });
  }

  if (!ready) {
    return <div style={{ minHeight: '100dvh', display: 'grid', placeItems: 'center', background: T.bg, fontFamily: T.serif, fontStyle: 'italic', color: T.inkMute }}>Lighting the lanterns…</div>;
  }
  if (!ch) {
    return <div style={{ minHeight: '100dvh', display: 'grid', placeItems: 'center', background: T.bg, fontFamily: T.serif, color: T.inkSoft, textAlign: 'center', padding: 24 }}>
      <div><div style={{ fontSize: 18, marginBottom: 10 }}>No character loaded.</div><a href="character.html" style={{ color: T.accent }}>Open the full editor →</a></div>
    </div>;
  }

  const sub = tab === 'campaign' ? (campaign ? campaign.name : 'Campaign') : `${ch.basicInfo.class || '—'} · Lv ${ch.basicInfo.level}`;

  let screen;
  if (tab === 'combat') screen = <CombatScreen ch={ch} onRes={onRes} onCond={onCond} onOpenAttack={a => setSheet({ kind: 'attack', payload: a })} density={DENSITY} />;
  else if (tab === 'sheet') screen = <SheetScreen ch={ch} update={mutate} density={DENSITY} />;
  else if (tab === 'cards') screen = <CardsScreen ch={ch} density={DENSITY} />;
  else if (tab === 'notes') screen = <NotesScreen ch={ch} session={session} feed={feed} onStart={startSession} onEnd={() => setSheet({ kind: 'endsession' })} onAddNote={addNote} onNotes={setNotes} density={DENSITY} />;
  else screen = <CampaignScreen data={{ campaign: campaign || { name: 'Campaign', sessionCount: 0 }, roster }} layout="feed" session={session} feed={feed} onAddNote={addNote} onToggleSession={toggleSession} onPeek={peek} onSwitch={onSwitch} onNewChar={() => setSheet({ kind: 'newchar' })} onEditCampaign={() => setSheet({ kind: 'editcampaign' })} density={DENSITY} />;

  const screenInner = (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.bg, position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, background: T.bgGlow, pointerEvents: 'none' }} />
      <div style={{ flexShrink: 0, position: 'relative', zIndex: 2, padding: '13px 16px 11px', display: 'flex', alignItems: 'center', gap: 11, borderBottom: `1px solid ${T.line}`, background: T.dark ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.4)' }}>
        <div className="rs-tap" onClick={() => setTab('campaign')} style={{ cursor: 'pointer' }}><Avatar ch={ch} size={38} /></div>
        <div style={{ minWidth: 0, flex: 1 }} className="rs-tap" onClick={() => setTab('campaign')}>
          <div style={{ fontFamily: T.serif, fontSize: 16, fontWeight: 600, color: T.ink, lineHeight: 1.1, cursor: 'pointer' }}>{ch.basicInfo.name}</div>
          <div style={{ fontFamily: T.sans, fontSize: 10.5, color: T.inkMute, marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{sub}</div>
        </div>
        {session.live && (
          <div className="rs-tap" onClick={() => setTab('notes')} style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, fontFamily: T.sans, fontSize: 10.5, fontWeight: 600, color: T.accent, border: `1px solid ${T.accent}`, borderRadius: 999, padding: '4px 10px', whiteSpace: 'nowrap' }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: T.accent, animation: 'rs-pulse 1.4s ease-in-out infinite' }} />{session.elapsed}
          </div>
        )}
        <div className="rs-tap" onClick={() => setSheet({ kind: 'more' })} style={{ cursor: 'pointer', padding: 2 }}><Icon name="menu" s={20} c={T.inkSoft} sw={1.7} /></div>
      </div>

      <div key={tab} className="rs-scroll" style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', position: 'relative', zIndex: 1, minWidth: 0 }}>{screen}</div>

      <div style={{ flexShrink: 0, position: 'relative', zIndex: 2, display: 'flex', borderTop: `1px solid ${T.line}`, background: T.dark ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.7)', backdropFilter: 'blur(8px)', paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
        {TABS.map(tb => {
          const on = tab === tb.id;
          return (
            <button key={tb.id} className="rs-tap" onClick={() => setTab(tb.id)} style={{ flex: 1, background: 'none', border: 'none', cursor: 'pointer', padding: '9px 0 8px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, color: on ? T.accent : T.inkMute, transition: 'color 0.15s' }}>
              <Icon name={tb.icon} s={22} c={on ? T.accent : T.inkMute} sw={on ? 1.9 : 1.6} />
              <span style={{ fontFamily: T.sans, fontSize: 10, fontWeight: on ? 700 : 500, letterSpacing: '0.02em' }}>{tb.label}</span>
            </button>
          );
        })}
      </div>

      <BottomSheet open={!!sheet} onClose={() => setSheet(null)}>
        {sheet && sheet.kind === 'attack' && <AttackDetail a={sheet.payload} />}
        {sheet && (sheet.kind === 'peek' || sheet.kind === 'memorial') && <CharacterPeek c={sheet.payload} onJump={jump} />}
        {sheet && sheet.kind === 'newchar' && <NewCharacterForm onCreate={createCharacter} />}
        {sheet && sheet.kind === 'editcampaign' && <CampaignEditForm campaign={campaign || {}} onSave={patchCampaign} />}
        {sheet && sheet.kind === 'death' && <DeathDoor onClose={() => setSheet(null)} onLog={logDeathNote} onDie={markDead} />}
        {sheet && sheet.kind === 'endsession' && <EndSession session={session} onKeep={() => setSheet(null)} onEnd={endSession} />}
        {sheet && sheet.kind === 'more' && <MoreMenu onLogout={logout} />}
      </BottomSheet>
    </div>
  );

  return (
    <div style={{ minHeight: '100dvh', display: 'flex', justifyContent: 'center', background: T.dark ? '#0c0a09' : '#e3dccd' }}>
      <div style={{ width: '100%', maxWidth: 440, height: '100dvh', overflow: 'hidden', position: 'relative', boxShadow: '0 0 60px rgba(0,0,0,0.12)' }}>{screenInner}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
