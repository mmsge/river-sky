<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Characters — Daggerheart</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment: #f4e8c1;
      --ink: #2b1d0e;
      --ink-light: #5c3d1e;
      --border: #8b4513;
      --gold: #c8860a;
      --danger: #8b0000;
      --success: #1a5c1a;
    }

    body {
      min-height: 100vh;
      background-color: var(--parchment);
      background-image:
        radial-gradient(ellipse at 15% 30%, rgba(139,90,43,0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 70%, rgba(100,60,20,0.07) 0%, transparent 50%),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139,90,43,0.015) 3px, rgba(139,90,43,0.015) 4px),
        repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(139,90,43,0.01) 4px, rgba(139,90,43,0.01) 5px);
      font-family: 'IM Fell English', Georgia, serif;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at top left,    rgba(100,60,10,0.13) 0%, transparent 28%),
        radial-gradient(ellipse at bottom right, rgba(100,60,10,0.11) 0%, transparent 28%);
    }
    body > * { position: relative; z-index: 1; }

    header {
      text-align: center;
      padding: 14px 16px 10px;
      border-bottom: 3px double var(--border);
      background: linear-gradient(180deg, rgba(200,134,10,0.09) 0%, transparent 100%);
    }
    .header-nav { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .nav-link {
      font-family: 'Cinzel', serif; font-size: 0.75rem;
      color: var(--ink-light); text-decoration: none;
      border: 1px solid var(--border); border-radius: 3px;
      padding: 3px 10px; background: rgba(139,69,19,0.06);
      cursor: pointer; transition: all 0.15s;
    }
    .nav-link:hover { background: rgba(200,134,10,0.15); color: var(--ink); }
    .page-title {
      font-family: 'Cinzel', serif; font-size: clamp(1.5rem,4vw,2.2rem);
      font-weight: 700; letter-spacing: 0.05em;
      text-shadow: 1px 1px 0 rgba(200,134,10,0.3);
    }
    .page-sub { font-style: italic; color: var(--ink-light); font-size: 0.9rem; }

    main { max-width: 980px; margin: 0 auto; padding: 22px 16px 70px; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
    .section-head { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.05em; }
    .btn {
      font-family: 'Cinzel', serif; font-size: 0.8rem; cursor: pointer;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 7px 14px; background: rgba(200,134,10,0.12); color: var(--ink);
      transition: all 0.15s;
    }
    .btn:hover { background: rgba(200,134,10,0.25); }

    .loading, .empty { text-align: center; padding: 40px; font-style: italic; color: var(--ink-light); }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .char-card {
      border: 1px solid rgba(139,69,19,0.4); border-radius: 7px;
      background: rgba(255,255,240,0.55); padding: 16px;
      cursor: pointer; transition: all 0.15s; position: relative;
      display: flex; flex-direction: column; gap: 8px;
    }
    .char-card:hover { background: rgba(255,255,240,0.9); box-shadow: 0 3px 12px rgba(100,60,10,0.18); transform: translateY(-2px); }
    .char-card.dead { border-color: rgba(139,0,0,0.5); background: rgba(255,240,240,0.6); }
    .char-card.active { box-shadow: 0 0 0 2px var(--gold); }

    .card-name {
      font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .skull { font-size: 1.2rem; }
    .card-meta { font-size: 0.86rem; color: var(--ink-light); }
    .card-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.84rem; }
    .hp-bar { display: flex; gap: 3px; }
    .hp-dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #8B3A3A; }
    .hp-dot.filled { background: #8B3A3A; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .tag {
      font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.04em;
      border: 1px solid rgba(26,92,26,0.35); color: var(--success);
      background: rgba(26,92,26,0.08); border-radius: 3px; padding: 2px 7px;
    }
    .tag.none { color: var(--ink-light); border-color: rgba(139,69,19,0.3); background: rgba(139,69,19,0.05); }
    .badge-active {
      position: absolute; top: 10px; right: 10px;
      font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.06em;
      color: var(--gold); border: 1px solid var(--gold); border-radius: 3px;
      padding: 1px 6px; background: rgba(200,134,10,0.1);
    }
    .card-actions { display: flex; gap: 8px; margin-top: 6px; }
    .card-actions .btn { flex: 1; text-align: center; font-size: 0.72rem; padding: 5px 8px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(20,12,4,0.55);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--parchment); border: 2px solid var(--border); border-radius: 8px;
      padding: 20px; max-width: 380px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .modal-title { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    .modal-input {
      width: 100%; font-family: 'IM Fell English', serif; font-size: 1rem;
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
      background: rgba(255,255,255,0.5); color: var(--ink); margin-bottom: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--parchment); padding: 10px 18px; border-radius: 5px;
      font-family: 'Cinzel', serif; font-size: 0.8rem; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="header-nav">
    <a href="/campaigns.html" class="nav-link">📚 Campaigns</a>
    <a href="/advisor.html" class="nav-link">⚔ Combat Advisor</a>
    <a href="/sessions.html" class="nav-link">📖 Sessions</a>
    <a href="/odds.html" class="nav-link">🎲 Roll Odds</a>
    <a href="/mobile.html" class="nav-link">📱 Mobile</a>
  </div>
  <div class="page-title">⚔ Heroes of the Realm</div>
  <div class="page-sub">Choose a character — or forge a new one</div>
</header>

<main>
  <div class="toolbar">
    <div class="section-head">🧙 Characters</div>
    <button class="btn" id="new-char-btn">＋ New Character</button>
  </div>
  <div id="loading" class="loading">Summoning heroes…</div>
  <div id="cards" class="card-grid" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">No characters yet. Create your first hero!</div>
</main>

<!-- New character modal -->
<div class="modal-overlay hidden" id="new-modal">
  <div class="modal">
    <div class="modal-title">New Character</div>
    <input class="modal-input" id="new-name" type="text" placeholder="Character name" maxlength="60">
    <div class="modal-actions">
      <button class="btn" id="new-cancel">Cancel</button>
      <button class="btn" id="new-create">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function showToast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

async function apiFetch(url, opts = {}) {
  const res = await fetch(url, opts);
  if (res.status === 401) {
    window.location.href = '/login.html?return=' + encodeURIComponent('/');
    return null;
  }
  return res;
}

function hpBar(hp) {
  if (!hp || !hp.max) return '';
  const max = Math.min(hp.max, 18);
  let dots = '';
  for (let i = 0; i < max; i++) dots += `<span class="hp-dot${i < hp.current ? ' filled' : ''}"></span>`;
  return `<span class="hp-bar" title="HP ${hp.current}/${hp.max}">${dots}</span>`;
}

async function selectCharacter(id) {
  await fetch('/api/characters/select/' + id, { method: 'POST' });
}

function renderCards(chars) {
  const grid = document.getElementById('cards');
  grid.innerHTML = chars.map(ch => {
    const s = ch.summary || {};
    const dead = s.dead;
    const subParts = [s.ancestry, s.subclass || s.class, s.level != null ? 'Lv.' + s.level : ''].filter(Boolean);
    const tags = (ch.campaigns && ch.campaigns.length)
      ? ch.campaigns.map(c => `<span class="tag">${esc(c)}</span>`).join('')
      : '<span class="tag none">No campaign</span>';
    return `
      <div class="char-card${dead ? ' dead' : ''}${ch.active ? ' active' : ''}" data-id="${ch.id}">
        ${ch.active ? '<span class="badge-active">● Selected</span>' : ''}
        <div class="card-name">${dead ? '<span class="skull">💀</span>' : ''}${esc(s.name || ch.name)}</div>
        <div class="card-meta">${esc(subParts.join(' · ')) || '<em>Unfinished hero</em>'}</div>
        <div class="card-row"><span>${dead ? '<strong style="color:var(--danger)">Fallen</strong>' : 'Hit Points'}</span>${hpBar(s.hp)}</div>
        <div class="tags">${tags}</div>
        <div class="card-actions">
          <button class="btn act-play" data-id="${ch.id}">📜 Open Sheet</button>
          <button class="btn act-advisor" data-id="${ch.id}">⚔ Advisor</button>
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.act-play, .char-card').forEach(el => {
    el.addEventListener('click', async (e) => {
      if (e.target.classList.contains('act-advisor')) return;
      const id = el.dataset.id;
      if (!id) return;
      await selectCharacter(id);
      window.location.href = '/character.html?character=' + id;
    });
  });
  grid.querySelectorAll('.act-advisor').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await selectCharacter(btn.dataset.id);
      window.location.href = '/advisor.html';
    });
  });
}

async function load() {
  const res = await fetch('/api/characters');
  const chars = await res.json();
  document.getElementById('loading').style.display = 'none';
  if (!chars.length) {
    document.getElementById('empty').style.display = '';
    return;
  }
  const grid = document.getElementById('cards');
  grid.style.display = '';
  renderCards(chars);
}

// New character modal
const newModal = document.getElementById('new-modal');
document.getElementById('new-char-btn').addEventListener('click', () => {
  document.getElementById('new-name').value = '';
  newModal.classList.remove('hidden');
  setTimeout(() => document.getElementById('new-name').focus(), 60);
});
document.getElementById('new-cancel').addEventListener('click', () => newModal.classList.add('hidden'));
document.getElementById('new-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('new-create').click(); });
document.getElementById('new-create').addEventListener('click', async () => {
  const name = document.getElementById('new-name').value.trim() || 'New Character';
  const res = await apiFetch('/api/characters', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!res) return;
  if (!res.ok) { showToast('Could not create character', 'err'); return; }
  const data = await res.json();
  window.location.href = '/character.html?character=' + data.characterId;
});

load();
</script>
</body>
</html>
