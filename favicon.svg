<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="River Sky favicon">
  <title>River Sky</title>
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="18" ry="14" fill="#4a8c3f"/>
  <!-- Head -->
  <ellipse cx="32" cy="26" rx="16" ry="13" fill="#5aab4a"/>
  <!-- Eyes (white) -->
  <circle cx="22" cy="20" r="7" fill="#ffffff"/>
  <circle cx="42" cy="20" r="7" fill="#ffffff"/>
  <!-- Pupils -->
  <circle cx="22" cy="20" r="4" fill="#1a2e1a"/>
  <circle cx="42" cy="20" r="4" fill="#1a2e1a"/>
  <!-- Eye shine -->
  <circle cx="23.5" cy="18.5" r="1.5" fill="#ffffff"/>
  <circle cx="43.5" cy="18.5" r="1.5" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M23 32 Q32 39 41 32" fill="none" stroke="#3a7030" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nostrils -->
  <circle cx="29" cy="28" r="1.5" fill="#3a7030"/>
  <circle cx="35" cy="28" r="1.5" fill="#3a7030"/>
