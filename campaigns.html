<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaigns — Daggerheart</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --parchment: #f4e8c1; --ink: #2b1d0e; --ink-light: #5c3d1e;
      --border: #8b4513; --gold: #c8860a; --danger: #8b0000; --success: #1a5c1a;
    }
    body {
      min-height: 100vh; background-color: var(--parchment);
      background-image:
        radial-gradient(ellipse at 15% 30%, rgba(139,90,43,0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 70%, rgba(100,60,20,0.07) 0%, transparent 50%);
      font-family: 'IM Fell English', Georgia, serif; color: var(--ink); font-size: 16px; line-height: 1.5;
    }
    header {
      text-align: center; padding: 14px 16px 10px;
      border-bottom: 3px double var(--border);
      background: linear-gradient(180deg, rgba(200,134,10,0.09) 0%, transparent 100%);
    }
    .header-nav { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .nav-link {
      font-family: 'Cinzel', serif; font-size: 0.75rem; color: var(--ink-light); text-decoration: none;
      border: 1px solid var(--border); border-radius: 3px; padding: 3px 10px;
      background: rgba(139,69,19,0.06); cursor: pointer; transition: all 0.15s;
    }
    .nav-link:hover { background: rgba(200,134,10,0.15); color: var(--ink); }
    .page-title {
      font-family: 'Cinzel', serif; font-size: clamp(1.5rem,4vw,2.2rem); font-weight: 700;
      letter-spacing: 0.05em; text-shadow: 1px 1px 0 rgba(200,134,10,0.3);
    }
    main { max-width: 820px; margin: 0 auto; padding: 22px 16px 70px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
    .section-head { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.05em; }
    .btn {
      font-family: 'Cinzel', serif; font-size: 0.78rem; cursor: pointer;
      border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px;
      background: rgba(200,134,10,0.12); color: var(--ink); transition: all 0.15s;
    }
    .btn:hover { background: rgba(200,134,10,0.25); }
    .btn.sm { font-size: 0.68rem; padding: 3px 8px; }
    .btn.danger { color: var(--danger); border-color: rgba(139,0,0,0.4); background: rgba(139,0,0,0.06); }
    .loading, .empty { text-align: center; padding: 40px; font-style: italic; color: var(--ink-light); }

    .camp-card {
      border: 1px solid rgba(139,69,19,0.4); border-radius: 7px;
      background: rgba(255,255,240,0.55); padding: 16px; margin-bottom: 14px;
    }
    .camp-name { font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 700; cursor: pointer; }
    .camp-name:hover { color: var(--gold); }
    .camp-desc { font-style: italic; color: var(--ink-light); font-size: 0.9rem; margin: 4px 0; }
    .camp-meta { font-family: 'Cinzel', serif; font-size: 0.66rem; color: var(--ink-light); letter-spacing: 0.04em; }
    .detail { margin-top: 12px; border-top: 1px solid rgba(139,69,19,0.2); padding-top: 12px; display: none; }
    .camp-card.open .detail { display: block; }
    .sub-head { font-family: 'Cinzel', serif; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; margin: 10px 0 6px; }
    .member-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.9rem; }
    .member-row .grow { flex: 1; }
    .add-row { display: flex; gap: 6px; margin-top: 6px; }
    .add-row select { font-family: 'IM Fell English', serif; padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; background: rgba(255,255,255,0.5); flex: 1; }
    .sess-row { font-size: 0.86rem; padding: 4px 0; color: var(--ink-light); display: flex; gap: 8px; }
    .sess-badge { font-family: 'Cinzel', serif; font-size: 0.58rem; padding: 1px 6px; border-radius: 3px; border: 1px solid; }
    .sess-badge.active { color: var(--success); border-color: var(--success); }
    .sess-badge.ended { color: var(--ink-light); border-color: rgba(139,69,19,0.3); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(20,12,4,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--parchment); border: 2px solid var(--border); border-radius: 8px; padding: 20px; max-width: 400px; width: 100%; }
    .modal-title { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    .modal-input, .modal textarea {
      width: 100%; font-family: 'IM Fell English', serif; font-size: 1rem; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 4px; background: rgba(255,255,255,0.5); color: var(--ink); margin-bottom: 12px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--parchment); padding: 10px 18px; border-radius: 5px; font-family: 'Cinzel', serif; font-size: 0.8rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 200; }
    #toast.show { opacity: 1; } #toast.err { background: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="header-nav">
    <a href="/" class="nav-link">🏠 Characters</a>
    <a href="/sessions.html" class="nav-link">📖 Sessions</a>
    <a href="/odds.html" class="nav-link">🎲 Roll Odds</a>
  </div>
  <div class="page-title">📚 Campaigns</div>
</header>

<main>
  <div class="toolbar">
    <div class="section-head">Your Campaigns</div>
    <button class="btn" id="new-camp-btn">＋ New Campaign</button>
  </div>
  <div id="loading" class="loading">Loading campaigns…</div>
  <div id="list" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">No campaigns yet. Create one to group your sessions and heroes.</div>
</main>

<div class="modal-overlay hidden" id="new-modal">
  <div class="modal">
    <div class="modal-title">New Campaign</div>
    <input class="modal-input" id="camp-name" type="text" placeholder="Campaign name" maxlength="80">
    <textarea id="camp-desc" rows="2" placeholder="Description (optional)"></textarea>
    <div class="modal-actions">
      <button class="btn" id="camp-cancel">Cancel</button>
      <button class="btn" id="camp-create">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s) { if (!s) return ''; const d = new Date(s.replace(' ','T')); return d.toLocaleString([], {dateStyle:'short', timeStyle:'short'}); }
let toastTimer;
function showToast(msg, type='ok') { const el = document.getElementById('toast'); el.textContent = msg; el.className = 'show ' + type; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = '', 2600); }
async function apiFetch(url, opts = {}) {
  const res = await fetch(url, opts);
  if (res.status === 401) { window.location.href = '/login.html?return=' + encodeURIComponent('/campaigns.html'); return null; }
  return res;
}

let ALL_CHARACTERS = [];
const openCampaigns = new Set();

async function loadAll() {
  const [campsRes, charsRes] = await Promise.all([fetch('/api/campaigns'), fetch('/api/characters')]);
  const camps = await campsRes.json();
  ALL_CHARACTERS = await charsRes.json();
  document.getElementById('loading').style.display = 'none';
  const list = document.getElementById('list');
  if (!camps.length) { document.getElementById('empty').style.display = ''; list.style.display = 'none'; return; }
  list.style.display = '';
  list.innerHTML = camps.map(c => `
    <div class="camp-card${openCampaigns.has(c.id) ? ' open' : ''}" id="camp-${c.id}">
      <div class="camp-name" data-id="${c.id}">${esc(c.name)}</div>
      ${c.description ? `<div class="camp-desc">${esc(c.description)}</div>` : ''}
      <div class="camp-meta">${c.characterCount} character${c.characterCount===1?'':'s'} · ${c.sessionCount} session${c.sessionCount===1?'':'s'}</div>
      <div class="detail" id="detail-${c.id}"></div>
    </div>`).join('');
  list.querySelectorAll('.camp-name').forEach(el => el.addEventListener('click', () => toggleCampaign(parseInt(el.dataset.id, 10))));
  // Re-open any expanded ones
  openCampaigns.forEach(id => loadDetail(id));
}

async function toggleCampaign(id) {
  const card = document.getElementById('camp-' + id);
  if (openCampaigns.has(id)) { openCampaigns.delete(id); card.classList.remove('open'); }
  else { openCampaigns.add(id); card.classList.add('open'); await loadDetail(id); }
}

async function loadDetail(id) {
  const el = document.getElementById('detail-' + id);
  if (!el) return;
  const data = await fetch('/api/campaigns/' + id).then(r => r.json());
  const memberIds = new Set(data.characters.map(c => c.id));
  const available = ALL_CHARACTERS.filter(c => !memberIds.has(c.id));

  const members = data.characters.length
    ? data.characters.map(c => `
        <div class="member-row">
          <span class="grow">${c.summary && c.summary.dead ? '💀 ' : ''}${esc(c.name)}</span>
          <button class="btn sm danger remove-member" data-camp="${id}" data-char="${c.id}">Remove</button>
        </div>`).join('')
    : '<div class="member-row" style="color:var(--ink-light);font-style:italic">No characters yet</div>';

  const addControl = available.length ? `
    <div class="add-row">
      <select id="add-sel-${id}">${available.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <button class="btn sm add-member" data-camp="${id}">＋ Add</button>
    </div>` : '';

  const sessions = data.sessions.length
    ? data.sessions.map(s => `
        <div class="sess-row">
          <span class="sess-badge ${s.ended_at ? 'ended' : 'active'}">${s.ended_at ? 'Ended' : 'Active'}</span>
          <span class="grow">${esc(s.name)}${s.character_name ? ' · ' + esc(s.character_name) : ''}</span>
          <span>${fmtDate(s.started_at)}</span>
        </div>`).join('')
    : '<div class="sess-row" style="font-style:italic">No sessions yet</div>';

  el.innerHTML = `
    <div class="sub-head">🧙 Characters</div>${members}${addControl}
    <div class="sub-head">📖 Sessions</div>${sessions}`;

  el.querySelectorAll('.remove-member').forEach(b => b.addEventListener('click', async () => {
    const res = await apiFetch('/api/campaigns/' + b.dataset.camp + '/characters/remove', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ characterId: parseInt(b.dataset.char, 10) }),
    });
    if (res && res.ok) { showToast('Removed'); await loadAll(); }
  }));
  el.querySelectorAll('.add-member').forEach(b => b.addEventListener('click', async () => {
    const sel = document.getElementById('add-sel-' + b.dataset.camp);
    const res = await apiFetch('/api/campaigns/' + b.dataset.camp + '/characters', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ characterId: parseInt(sel.value, 10) }),
    });
    if (res && res.ok) { showToast('Added'); await loadAll(); }
  }));
}

const newModal = document.getElementById('new-modal');
document.getElementById('new-camp-btn').addEventListener('click', () => {
  document.getElementById('camp-name').value = ''; document.getElementById('camp-desc').value = '';
  newModal.classList.remove('hidden');
  setTimeout(() => document.getElementById('camp-name').focus(), 60);
});
document.getElementById('camp-cancel').addEventListener('click', () => newModal.classList.add('hidden'));
document.getElementById('camp-create').addEventListener('click', async () => {
  const name = document.getElementById('camp-name').value.trim();
  if (!name) { showToast('Name required', 'err'); return; }
  const res = await apiFetch('/api/campaigns', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, description: document.getElementById('camp-desc').value.trim() }),
  });
  if (!res) return;
  if (!res.ok) { showToast('Could not create', 'err'); return; }
  newModal.classList.add('hidden');
  showToast('Campaign created');
  await loadAll();
});

loadAll();
</script>
</body>
</html>
