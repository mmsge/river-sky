<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>River Sky — Sign In</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment: #f4e8c1;
      --ink: #2b1d0e;
      --ink-light: #5c3d1e;
      --border: #8b4513;
      --gold: #c8860a;
      --danger: #8b0000;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--parchment);
      background-image:
        radial-gradient(ellipse at 15% 30%, rgba(139,90,43,0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 70%, rgba(100,60,20,0.07) 0%, transparent 50%),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139,90,43,0.015) 3px, rgba(139,90,43,0.015) 4px),
        repeating-linear-gradient(0deg,  transparent, transparent 4px, rgba(139,90,43,0.01)  4px, rgba(139,90,43,0.01)  5px);
      font-family: 'IM Fell English', Georgia, serif;
      color: var(--ink);
    }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at top left,    rgba(100,60,10,0.13) 0%, transparent 28%),
        radial-gradient(ellipse at bottom right, rgba(100,60,10,0.11) 0%, transparent 28%);
    }

    .card {
      position: relative;
      background: rgba(244, 232, 193, 0.85);
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      width: min(340px, 90vw);
      box-shadow: 0 4px 24px rgba(43,29,14,0.18), inset 0 0 40px rgba(139,90,43,0.06);
      text-align: center;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-style: italic;
      color: var(--ink-light);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      color: var(--ink-light);
      margin-bottom: 0.35rem;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.04em;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(255,255,255,0.5);
      font-family: 'IM Fell English', Georgia, serif;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="password"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(200,134,10,0.18);
    }

    button {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--border);
      color: var(--parchment);
      border: none;
      border-radius: 3px;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #6b3010; }
    button:active { background: #4a2008; }

    .error {
      margin-top: 1rem;
      color: var(--danger);
      font-size: 0.9rem;
      font-style: italic;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>River Sky</h1>
    <p class="subtitle">Character Keeper — Restricted Access</p>
    <form id="loginForm">
      <label for="password">Passphrase</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password">
      <button type="submit">Enter</button>
      <p class="error" id="errorMsg"></p>
    </form>
  </div>

  <script>
    const params   = new URLSearchParams(location.search);
    const returnTo = params.get('return') || '/character.html';

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ password })
        });

        if (res.ok) {
          window.location.href = returnTo;
        } else {
          errorMsg.textContent = 'Incorrect passphrase.';
          document.getElementById('password').select();
        }
      } catch {
        errorMsg.textContent = 'Could not reach the server.';
      }
    });
  </script>
</body>
</html>
